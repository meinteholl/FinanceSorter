<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Finance Sorter</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1115; color: #c9d1d9; font: 14px/1.5 system-ui, sans-serif; }
    .wrap { display: grid; place-items: center; height: 100%; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #58a6ff; display: inline-block; margin: 0 2px; animation: b 1s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes b { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <div style="margin-bottom: 12px; text-align: center;">Finance Sorter wordt gestart</div>
      <div style="text-align: center;"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
  </div>
</body>
</html>
